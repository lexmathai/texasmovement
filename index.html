<style>
:root{
  --ink:#14202B;--concrete:#E3E6E7;--white:#F6F7F7;
  --blue:#1479B8;--red:#C8102E;--mute:#46535F;
  --line:rgba(20,32,43,.25);
  --head:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--concrete);color:var(--ink);font:1.0625rem/1.65 var(--body)}
a{color:inherit;text-underline-offset:4px}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.display{font-family:var(--head);font-stretch:62%;font-weight:800;line-height:.95;letter-spacing:-.025em;margin:0}
.section-title{font-size:clamp(2.8rem,8vw,5.2rem);margin-bottom:18px}
.section-intro{max-width:44rem;margin:0 0 30px}
.eyebrow{font:800 .8rem/1.4 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}
.small{color:var(--mute);font-size:.95rem}
.link{font-weight:600}
.skip-link{position:absolute;left:20px;top:-100px;background:var(--ink);color:var(--white);padding:12px 18px;z-index:100}
.skip-link:focus{top:12px}
header{position:relative;padding:18px 0 34px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:17px;background:linear-gradient(to bottom,var(--blue) 0 5px,transparent 5px 12px,var(--blue) 12px 17px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mark{font:800 1.6rem/1 var(--head);font-stretch:62%;text-decoration:none}
nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font:600 .9rem var(--head)}
nav a{text-decoration:none}
nav a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--white);font:700 1rem/1.3 var(--head);padding:14px 22px;border:2px solid var(--ink);text-decoration:none;cursor:pointer;min-height:48px;text-align:center}
.btn:hover{background:var(--blue);border-color:var(--blue)}
.btn.secondary{background:transparent;color:var(--ink)}
.btn.secondary:hover{background:var(--ink);color:var(--white);border-color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.blue:hover{background:var(--ink);border-color:var(--ink)}
nav .btn{padding:10px 14px;min-height:44px}
.actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.actions a:not(.btn){font-weight:600}
.hero{display:grid;gap:32px;padding:44px 0 64px}
[role=tablist]{display:flex;flex-direction:column;align-items:flex-start}
.tab{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;font:800 clamp(3.5rem,14vw,7.6rem)/.9 var(--head);font-stretch:62%;letter-spacing:-.02em;color:rgba(20,32,43,.4);transition:color .25s}
.tab:hover{color:rgba(20,32,43,.65)}
.tab[aria-selected=true]{color:var(--ink)}
.lede{max-width:34rem;margin:28px 0 22px}
figure{margin:0}
svg{display:block;width:100%;height:auto}
.m{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;transition:stroke .3s,stroke-width .3s}
.node{fill:var(--concrete);stroke:var(--ink);stroke-width:3}
.sup{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
svg[data-state=diagnose] .weak{stroke:var(--red);stroke-width:5;stroke-dasharray:9 7}
svg[data-state=build] .weak{stroke:var(--blue);stroke-width:7}
svg[data-state=transfer] .m{stroke:var(--blue)}
svg[data-state=transfer] .weak{stroke-width:4}
svg[data-state=transfer] .node{stroke:var(--blue)}
.ld{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:2 4;opacity:0;transition:opacity .3s}
.lbl{font:600 19px var(--body);fill:var(--ink);opacity:0;transition:opacity .3s}
svg[data-state=diagnose] .l-diagnose,svg[data-state=build] .l-build,svg[data-state=transfer] .l-transfer,
svg[data-state=diagnose] .ld,svg[data-state=build] .ld,svg[data-state=transfer] .ld{opacity:1}
.wipe{animation:wipe 1.6s cubic-bezier(.3,.7,.2,1) both}
@keyframes wipe{from{width:0}to{width:640px}}
.cap{border-left:5px solid var(--blue);padding:4px 0 4px 18px;margin-top:20px;max-width:34rem}
.cap h2{font:800 1.9rem/1 var(--head);font-stretch:62%;margin:0 0 8px}
.cap p{margin:0 0 6px}
.cap .get{font-weight:600}
section{padding:64px 0}
section+section{border-top:2px solid var(--ink)}
.split{display:grid;gap:48px}
.split h2{font-size:clamp(3rem,10vw,5.2rem);margin-bottom:14px}
.split p{max-width:30rem;margin:0 0 18px}
ul.plain{list-style:none;margin:0 0 24px;padding:0;border-top:2px solid var(--ink)}
ul.plain li{padding:12px 0;border-bottom:1px solid var(--line)}
ul.plain strong{display:block;font-family:var(--head);font-size:1.15rem}
.surface{background:var(--white)}
